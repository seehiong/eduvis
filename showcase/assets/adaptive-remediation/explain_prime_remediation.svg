  <rect x="80" y="65" width="118" height="16" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" />
  <text x="139" y="76.5" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">MISCONCEPTION FIX</text>
  <g id="u1" data-reveal-order="1" data-ref="center" data-type="remediation_block">
  <rect x="80" y="90" width="281" height="304" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <path d="M 105 91 L 88 91 A 7 7 0 0 0 81 98 L 81 386 A 7 7 0 0 0 88 393 L 105 393 Z" fill="#ffedd5" />
  <line x1="105" y1="91" x2="105" y2="393" stroke="#fdba74" stroke-width="1" />
  <text x="93" y="242.0" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9a3412" text-anchor="middle" transform="rotate(-90, 93, 242.0)">SOLVE</text>
  <text x="116" y="119" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Which of the following numbers</text>
  <text x="116" y="137" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">is prime?</text>
  <rect x="116" y="165" width="106" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="135" cy="193" r="11" fill="#f1f5f9" />
  <text x="135" y="196.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">A</text>
  <text x="158" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">1 (first</text>
  <text x="158" y="196" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">positive</text>
  <text x="158" y="212" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">integer)</text>
  <rect x="238" y="165" width="106" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="257" cy="193" r="11" fill="#f1f5f9" />
  <text x="257" y="196.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">B</text>
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">4</text>
  <text x="280" y="196" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">(factors:</text>
  <text x="280" y="212" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">1, 2, 4)</text>
  <rect x="116" y="233" width="106" height="72" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="135" cy="269" r="11" fill="#f1f5f9" />
  <text x="135" y="272.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">C</text>
  <text x="158" y="248" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">6</text>
  <text x="158" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">(factors:</text>
  <text x="158" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">1, 2, 3,</text>
  <text x="158" y="296" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">6)</text>
  <rect x="238" y="233" width="106" height="72" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="257" cy="269" r="11" fill="#f1f5f9" />
  <text x="257" y="272.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">D</text>
  <text x="280" y="256" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">9</text>
  <text x="280" y="272" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">(factors:</text>
  <text x="280" y="288" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">1, 3, 9)</text>
  <rect x="116" y="317" width="106" height="72" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="135" cy="353" r="11" fill="#f1f5f9" />
  <text x="135" y="356.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">E</text>
  <text x="158" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">2 (only</text>
  <text x="158" y="348" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">even</text>
  <text x="158" y="364" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">prime</text>
  <text x="158" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">number)</text>
  <rect x="377" y="90" width="343" height="124" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <path d="M 402 91 L 385 91 A 7 7 0 0 0 378 98 L 378 206 A 7 7 0 0 0 385 213 L 402 213 Z" fill="#dbeafe" />
  <line x1="402" y1="91" x2="402" y2="213" stroke="#93c5fd" stroke-width="1" />
  <text x="390" y="152.0" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e40af" text-anchor="middle" transform="rotate(-90, 390, 152.0)">REMEMBER</text>
  <text x="413" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="start">Prime Numbers Rule</text>
  <text x="413" y="138" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">A prime number is a whole number greater</text>
  <text x="413" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">than 1.</text>
  <text x="413" y="174" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">It must have exactly two factors: 1 and</text>
  <text x="413" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">itself.</text>
  <rect x="377" y="230" width="343" height="192" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <path d="M 402 231 L 385 231 A 7 7 0 0 0 378 238 L 378 414 A 7 7 0 0 0 385 421 L 402 421 Z" fill="#ffedd5" />
  <line x1="402" y1="231" x2="402" y2="421" stroke="#fdba74" stroke-width="1" />
  <text x="390" y="326.0" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9a3412" text-anchor="middle" transform="rotate(-90, 390, 326.0)">SOLVE</text>
  <circle cx="428" cy="261" r="11" fill="#f97316" opacity="0.15" />
  <circle cx="428" cy="261" r="11" fill="none" stroke="#f97316" stroke-width="1.5" />
  <text x="428" y="265" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">1</text>
  <text x="451" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Step 1: Write down factors of Option C</text>
  <text x="451" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">(6): 1, 2, 3, 6 (four factors). Not</text>
  <text x="451" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">prime.</text>
  <line x1="428" y1="272" x2="428" y2="312" stroke="#f97316" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />
  <circle cx="428" cy="323" r="11" fill="#f97316" opacity="0.15" />
  <circle cx="428" cy="323" r="11" fill="none" stroke="#f97316" stroke-width="1.5" />
  <text x="428" y="327" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">2</text>
  <text x="451" y="326" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Step 2: Write down factors of Option E</text>
  <text x="451" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">(2): 1, 2 (exactly two factors). Prime!</text>
  <rect x="413" y="362" width="291" height="48" rx="6" fill="#f97316" opacity="0.08" />
  <rect x="413" y="362" width="291" height="48" rx="6" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.4" />
  <text x="427" y="381" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="start">Therefore, E is the correct answer.</text>
  </g>
</svg>