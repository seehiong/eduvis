  <rect x="377" y="90" width="343" height="142" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <path d="M 402 91 L 385 91 A 7 7 0 0 0 378 98 L 378 224 A 7 7 0 0 0 385 231 L 402 231 Z" fill="#dbeafe" />
  <line x1="402" y1="91" x2="402" y2="231" stroke="#93c5fd" stroke-width="1" />
  <text x="390" y="161.0" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e40af" text-anchor="middle" transform="rotate(-90, 390, 161.0)">REMEMBER</text>
  <text x="413" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="start">Composite Numbers Rule</text>
  <text x="413" y="138" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">A composite number is a positive integer</text>
  <text x="413" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">greater than 1 that has more than two</text>
  <text x="413" y="174" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">factors.</text>
  <text x="413" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Any whole number greater than 1 is either</text>
  <text x="413" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">prime or composite.</text>
  <rect x="377" y="248" width="343" height="192" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <path d="M 402 249 L 385 249 A 7 7 0 0 0 378 256 L 378 432 A 7 7 0 0 0 385 439 L 402 439 Z" fill="#ffedd5" />
  <line x1="402" y1="249" x2="402" y2="439" stroke="#fdba74" stroke-width="1" />
  <text x="390" y="344.0" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9a3412" text-anchor="middle" transform="rotate(-90, 390, 344.0)">SOLVE</text>
  <circle cx="428" cy="279" r="11" fill="#f97316" opacity="0.15" />
  <circle cx="428" cy="279" r="11" fill="none" stroke="#f97316" stroke-width="1.5" />
  <text x="428" y="283" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">1</text>
  <text x="451" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Step 1: List the factors of 2. It has</text>
  <text x="451" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">only 1 and 2 (Prime).</text>
  <line x1="428" y1="290" x2="428" y2="312" stroke="#f97316" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />
  <circle cx="428" cy="323" r="11" fill="#f97316" opacity="0.15" />
  <circle cx="428" cy="323" r="11" fill="none" stroke="#f97316" stroke-width="1.5" />
  <text x="428" y="327" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">2</text>
  <text x="451" y="326" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Step 2: List the factors of 9. Factors</text>
  <text x="451" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">are 1, 3, 9. Since it has more than two</text>
  <text x="451" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">factors, it is composite.</text>
  <rect x="413" y="380" width="291" height="48" rx="6" fill="#f97316" opacity="0.08" />
  <rect x="413" y="380" width="291" height="48" rx="6" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.4" />
  <text x="427" y="399" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="start">Therefore, D is the correct answer.</text>
