  <text x="280" y="196" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">(factors:</text>
  <text x="280" y="212" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">1, 3)</text>
  <rect x="116" y="233" width="106" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="135" cy="261" r="11" fill="#f1f5f9" />
  <text x="135" y="264.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">C</text>
