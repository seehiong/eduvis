  <text x="158" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">1, 5)</text>
  <rect x="238" y="233" width="106" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="257" cy="261" r="11" fill="#f1f5f9" />
