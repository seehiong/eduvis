  <text x="93" y="226.0" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9a3412" text-anchor="middle" transform="rotate(-90, 93, 226.0)">SOLVE</text>
  <text x="116" y="119" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Which of the following numbers</text>
  <text x="116" y="137" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">is a composite number?</text>
  <rect x="116" y="165" width="106" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
